name: linter-irods-clang-tidy
on: pull_request
defaults:
    run:
        shell: bash
jobs:
    clang-tidy:
        runs-on: ubuntu-24.04

        permissions:
            contents: read

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  # Get all history for the repository (branches, tags, etc).
                  # This is required in order for clang-tidy to work correctly.
                  fetch-depth: 0
            - name: Install Prerequisites
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -qq apt-transport-https ca-certificates
                  sudo apt-get install -qq \
                    wget \
                    curl \
                    gnupg \
                    g++ \
                    make \
                    cmake \
                    python3-dev \
                    unixodbc \
                    catch2 \
                    libcurl4-gnutls-dev \
                    libbz2-dev \
                    libfmt-dev \
                    zlib1g-dev \
                    libpam0g-dev \
                    libspdlog-dev \
                    libssl-dev \
                    libxml2-dev \
                    nlohmann-json3-dev \
                    unixodbc-dev \
                    python3-psutil \
                    odbc-postgresql \
                    python3-distro \
                    flex \
                    bison \
                    lsb-release \
                    libsystemd-dev \
                    libarchive-dev \
                    python3-yaml
            - name: Install iRODS Externals
              run: |
                  sudo mkdir -p /etc/apt/keyrings
                  wget -qO - https://unstable.irods.org/irods-unstable-signing-key.asc | \
                    sudo gpg \
                      --no-options \
                      --no-default-keyring \
                      --no-auto-check-trustdb \
                      --homedir /dev/null \
                      --no-keyring \
                      --import-options import-export \
                      --output /etc/apt/keyrings/renci-irods-unstable-archive-keyring.pgp \
                      --import
                  echo "deb [signed-by=/etc/apt/keyrings/renci-irods-unstable-archive-keyring.pgp arch=amd64] https://unstable.irods.org/apt/ $(lsb_release -sc) main" | \
                    sudo tee /etc/apt/sources.list.d/renci-irods-unstable.list
                  sudo apt-get update -qq
                  sudo apt-get install -qq \
                    irods-externals-boost1.81.0-2 \
                    irods-externals-clang16.0.6-0 \
                    irods-externals-jsoncons0.178.0-0 \
                    irods-externals-nanodbc2.14.0+216-1
            - name: Configure CMake
              run: |
                  mkdir build
                  cd build
                  cmake -DIRODS_DISABLE_COMPILER_OPTIMIZATIONS=YES -DIRODS_UNIT_TESTS_BUILD=YES ..
            - name: Run Clang-Tidy
              run: |
                  # Make clang and clang-tidy available.
                  export PATH=/opt/irods-externals/clang16.0.6-0/bin:$PATH
                  export PATH=/opt/irods-externals/clang16.0.6-0/share/clang:$PATH

                  # Run clang-tidy on the changes.
                  git diff -U0 origin/$GITHUB_BASE_REF | \
                      clang-tidy-diff.py -p1 -path build/compile_commands.json -quiet -timeout 1200 -export-fixes fixes.yaml | \
                      tee clang_tidy_output.txt
                      
                  # Helper file to print out the errors!
                  cat > tidy-printer.py <<'EOF'
                  import argparse
                  from pathlib import Path

                  from yaml import load
                  try:
                    from yaml import CLoader as Loader
                  except ImportError:
                    from yaml import Loader

                  parser = argparse.ArgumentParser()
                  parser.add_argument('filename', type=Path)
                  args = parser.parse_args()

                  with open(args.filename) as yaml_file:
                    data = load(yaml_file, Loader=Loader)

                  for report in data['Diagnostics']:
                    msg = report['DiagnosticMessage']
                    file = Path(msg['FilePath'])
                    desired_offset = int(msg['FileOffset'])

                    with open(file, 'r') as source_file:
                      prev_ln = 1
                      prev_offset = 0
                      offset = source_file.tell()

                      while offset < desired_offset:
                        _ = source_file.readline()
                        current_line = prev_ln + 1
                        offset = source_file.tell()

                        if offset >= desired_offset:
                          print(f'::{report['Level']} title=Clang-Tidy: {report['DiagnosticName']},file={file},line={prev_ln}::{msg['Message']}')
                          break

                        prev_ln = current_line
                        prev_offset = offset
                  EOF

                  # Return a failure if the output contains a clang-tidy error.
                  # clang-tidy-diff.py doesn't report a non-zero error code when it finds violations.
                  clang_tidy_text=$(cat clang_tidy_output.txt)
                  if [[ "$clang_tidy_text" == *": error: "* ]] ; then
                      echo 'Source code needs some attention!'
                      echo
                      echo 'If the results are hard to follow, you can enable color by running the following command at the bench:'
                      echo
                      echo "    git diff -U0 $GITHUB_BASE_REF | clang-tidy-diff.py -p1 -use-color -path /path/to/build/compile_commands.json -quiet"
                      echo
                      echo 'This command only works while the branch associated with this pull request is checked out.'
                      echo

                      python3 tidy-printer.py fixes.yaml

                      exit 1
                  fi

                  # Print a message if the output contains warnings, but do not report a non-zero error code.
                  # If there is a warning which needs to be an error, add it to the WarningsAsErrors section of the clang-tidy configuration.
                  if [[ "$clang_tidy_text" == *": warning: "* ]] ; then
                      echo 'The analysis generated warnings which you may want to consider fixing.'
                      echo
                      echo 'If the results are hard to follow, you can enable color by running the following command at the bench:'
                      echo
                      echo "    git diff -U0 $GITHUB_BASE_REF | clang-tidy-diff.py -p1 -use-color -path /path/to/build/compile_commands.json -quiet"
                      echo
                      echo 'This command only works while the branch associated with this pull request is checked out.'
                      echo

                      python3 tidy-printer.py fixes.yaml

                      exit 0
                  fi

                  echo "Source code is tidy :-)"
